<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HealthTik Privacy Policy</title>
    <meta
      name="description"
      content="Read the HealthTik Privacy Policy covering health and symptom records, optional location data, account management, analytics, and data deletion rights."

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      property="og:description"
      content="How HealthTik collects, uses, and protects your health symptom data, account data, and location information."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      (function () {
        try {
          if (localStorage.getItem('healthtik-theme') === 'dark') {
            document.documentElement.classList.add('dark');

        } catch (e) {}

        <p>HealthTik never sells your personal or health symptom data. For privacy questions or account deletion requests, email <a href="mailto:support@healthtik.me">support@healthtik.me</a>.</p>
        <p><a href="/">Home</a> | <a href="/support/">Support</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/privacy-main.tsx"></script>
