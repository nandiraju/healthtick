      <main style="max-width: 800px; margin: 40px auto; padding: 24px; font-family: system-ui, sans-serif;">
        <h1>HealthTik Privacy Policy</h1>
        <p>HealthTik never sells your personal or health symptom data. For privacy questions, email <a href="mailto:support@cend.in">support@cend.in</a>.</p>
        <p>Applies to the HealthTik iOS app (App Store ID 1076611952), the HealthTik Android app (Google Play, me.healthtik.app) and health.cend.in. Everything you enter is stored on your device only and is not sent to us. The apps do not collect crash logs, diagnostics or usage analytics.</p>
        <h2 id="delete-account">Delete your HealthTik account</h2>
        <p>App: "HealthTik: Symptom Tracker". Developer: Srikanth Nandiraju.</p>
        <ol>
          <li>Android: Settings → Apps → HealthTik → Storage → Clear storage. iOS: press and hold the HealthTik icon → Remove App → Delete App.</li>
          <li>Uninstalling the app on either platform has the same effect.</li>
          <li>Your account and data are deleted immediately.</li>
          <li>Need help or written confirmation? Email <a href="mailto:support@cend.in?subject=Delete%20my%20HealthTik%20account">support@cend.in</a> from your registered email address with the subject "Delete my HealthTik account". We reply within 7 days.</li>
        </ol>
        <p><strong>Deleted:</strong> your account (name, email address, password), symptom history, notes, and location data.</p>
        <p><strong>Kept:</strong> nothing by us, because your data never leaves your device. If you email us, that email exchange is kept for up to 90 days, then deleted. A device backup in your own Apple or Google account may contain app data until you delete it.</p>
        <p><a href="https://apps.apple.com/app/id1076611952">App Store</a> | <a href="https://play.google.com/store/apps/details?id=me.healthtik.app">Google Play</a></p>
        <p><a href="/">Home</a> | <a href="/support/">Support</a></p>
      </main>
