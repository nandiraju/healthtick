      <main style="max-width: 800px; margin: 40px auto; padding: 24px; font-family: system-ui, sans-serif;">
        <h1>HealthTik Privacy Policy</h1>
        <p>HealthTik never sells your personal or health symptom data. For privacy questions, email <a href="mailto:support@cend.in">support@cend.in</a>.</p>
        <h2 id="account-deletion">HealthTik Account Deletion</h2>
        <p>To delete your HealthTik account and associated data:</p>
        <ol>
          <li>Email <a href="mailto:support@cend.in?subject=Delete%20my%20HealthTik%20account">support@cend.in</a> from the email address registered to your HealthTik account.</li>
          <li>Use the subject line "Delete my HealthTik account".</li>
          <li>We reply to confirm the request came from the account owner.</li>
          <li>Once confirmed, we permanently delete your account and data within 30 days and email you when it is done.</li>
        </ol>
        <p><strong>Deleted:</strong> account profile and login credentials, all symptom entries with ratings, timestamps and notes, your symptom library, location data, and generated reports.</p>
        <p><strong>May be kept:</strong> anonymized aggregate diagnostics that cannot be linked to you, and records we are legally required to retain.</p>
        <p><strong>Retention period:</strong> personal data is removed within 30 days of a confirmed request and is not kept beyond that.</p>
        <p><a href="/">Home</a> | <a href="/support/">Support</a></p>
      </main>
    </noscript>
