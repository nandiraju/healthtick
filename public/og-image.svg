  <rect x="132" y="132" width="64" height="64" rx="20" fill="url(#brand)"/>
  <path d="M146 166h8l5-14 8 26 5-12h10" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="216" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="#0B1220">Health<tspan fill="#0D9488">Tik</tspan></text>

  <!-- Main Headline -->
  <text x="132" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="#0B1220" letter-spacing="-1.5">Track What Your Body</text>
  <text x="132" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="url(#brand)" letter-spacing="-1.5">Is Telling You.</text>

  <!-- Subheadline -->
  <text x="132" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#475569">Personal Health Symptom Tracking · Health Map · Analytics · Doctor-Ready Reports</text>

