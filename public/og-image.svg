<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="50%" stop-color="#EEF6F9"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.18" cy="0.22" r="0.5">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.85" cy="0.78" r="0.5">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Glass Card Container -->
  <rect x="72" y="72" width="1056" height="486" rx="40" fill="#FFFFFF" fill-opacity="0.72" stroke="#FFFFFF" stroke-width="2"/>

