  <rect x="358" y="468" width="176" height="44" rx="22" fill="#4F46E5" fill-opacity="0.12"/>
  <text x="446" y="496" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#4338CA">Health Map</text>

  <rect x="550" y="468" width="224" height="44" rx="22" fill="#0284C7" fill-opacity="0.12"/>
  <text x="662" y="496" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0369A1">Reports &amp; Analytics</text>
